services:
  backend:
    build: .
    volumes:
      - .:/var/www/backend
    depends_on:
      - db

  db:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: proyecto
      MYSQL_USER: proyecto
      MYSQL_PASSWORD: proyecto_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql
      - ./db/ddl.sql:/docker-entrypoint-initdb.d/ddl.sql:ro

  nginx:
    image: nginx:alpine
    ports:
      - "8000:443"
    volumes:
      - ./view:/var/www/frontend:ro
      - .:/var/www/backend:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend

volumes:
  db_data:

