services:
  backend:
    build: .
    volumes:
      - .:/var/www/backend

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./view:/var/www/frontend:ro
      - .:/var/www/backend:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

