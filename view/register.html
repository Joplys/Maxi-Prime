<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar cuenta · Maxi-bin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="register.css" />
</head>
<body>
  <div class="brand">
    <div class="logo-box"></div>
    Maxi-bin
  </div>

  <div class="card">
    <h2>Registrá tu cuenta</h2>

    <div class="field">
      <label for="username">Nombre de usuario</label>
      <input type="text" id="username" placeholder="tu usuario" />
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="tu@email.com" />
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" />
    </div>

    <button class="btn" id="btnRegister">Registrarse</button>

    <p class="link">Tenés una cuenta? <a href="login.html">Hacé login</a></p>
  </div>
<script>
  document.getElementById('btnRegister').addEventListener('click', function(e) {
    e.preventDefault();

    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    if (!username || !email || !password) {
      alert('Por favor completa todos los campos.');
      return;
    }

    fetch('/Maxi-Prime/api/auth.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'register',
        username: username,
        email: email,
        password: password
      })
    })
    .then(res => res.json())
    .then(data => {
      alert(data.message);
      if (data.status === 'success') {
        window.location.href = 'login.html';
      }
    })
    .catch(err => alert('Error de conexión con el servidor.'));
  });
</script>
</body>
</html>
