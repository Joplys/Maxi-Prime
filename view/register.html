<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar Cuenta</title>
  <link rel="stylesheet" href="register.css" />
</head>
<body>
  <div class="card">
    <h2>Registra tu cuenta</h2>

    <div class="field">
      <label for="username">Nombre de usuario</label>
      <input type="text" id="username" placeholder="tu usuario" />
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="tu@email.com" />
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" />
    </div>

    <button class="btn">Registrarse</button>

    <p class="link">Tienes una cuenta? <a href="login.html">Hazte login</a></p>
  </div>
  <script>
    document.getElementById('btnRegister').addEventListener('click', function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!username || !email || !password) {
        alert('Por favor completa todos los campos.');
        return;
      }

      fetch('auth.php', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          action: 'register',
          username: username,
          email: email,
          password: password
        })
      })
      .then(response => response.json())
      .then(data => {
        alert(data.message);
        if (data.status === 'success') {
          window.location.href = 'login.html';
        }
      })
      .catch(error => {
        console.error('Error:', error);
        alert('Ocurrió un error al conectar con el servidor.');
      });
    });
  </script>
</body>
</html>
