<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · Maxi-bin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
</head>
<body>
<div class="brand"><div class="logo-box"></div>Maxi-bin</div>
<div class="card">
<h2>Iniciá sesión</h2>
<form id="loginForm">
<div class="field"><label for="email">Email</label><input type="email" id="email" autocomplete="username" placeholder="tu@mail.com" required></div>
<div class="field"><label for="password">Contraseña</label><input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required></div>
<button class="btn" id="btnLogin" type="submit">Login</button>
</form>
<p class="link">¿No tenés cuenta? <a href="register.html">Registrate</a></p>
<p id="loginMessage" role="status" aria-live="polite"></p>
</div>
<script>
const API_AUTH = '/api/auth.php';
const loginForm = document.getElementById('loginForm');
const loginMessage = document.getElementById('loginMessage');
loginForm.addEventListener('submit', async event => {
  event.preventDefault();
  const email = document.getElementById('email').value.trim();
  const contrasena = document.getElementById('password').value;
  const button = document.getElementById('btnLogin');
  button.disabled = true;
  loginMessage.textContent = 'Ingresando…';
  try {
    const response = await fetch(API_AUTH, {
      method: 'POST',
      credentials: 'same-origin',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'login', email, contrasena})
    });
    const data = await response.json();
    if (!response.ok || data.status !== 'success') throw new Error(data.message || 'No se pudo iniciar sesión.');
    window.location.href = '/pagina principal/paginamapa.html';
  } catch (error) {
    loginMessage.textContent = error.message || 'No se pudo conectar con el servidor.';
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
